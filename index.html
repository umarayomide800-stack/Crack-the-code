// puzzle engine
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

const cache={},ev=x=>[...x].filter(d=>d%2==0).length;

 const n=c.n;const ck=n+(c.rep?'r':'');cache[ck]=cache[ck]||allCodes(n,c.rep);REP=!!c.rep;
