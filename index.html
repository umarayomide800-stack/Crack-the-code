function begin(mode,L){
 const d=DIFF[S.diff];let c;
 if(mode==='lvl')c=LV[L];
 else if(mode==='daily'){R=mul(hash(today()));c={n:4,k:6,m:7,p:1}}
 else if(mode==='twin'){const e=L-1;c={n:4,k:Math.min(20,6+e*2),m:Math.max(6,10-(e/3|0)),p:1,rep:1}}
 else{const e=L-1;c={n:5,k:Math.min(30,12+e*2),m:Math.max(4,7-(e/3|0)),p:1}}
 const g=make(c);R=Math.random;
 G=Object.assign(g,{mode,L,guess:'',lives:d.l,max:d.l,wr:0,hmax:d.h,hist:[],last:null,hints:[],order:shuffle([...Array(g.n).keys()]),notes:Array(10).fill(0),nm:0,ps:0,t0:Date.now(),el:0,msg:'',won:0,lost:0,pu:'',tx:''});
 draw();
}

 app.innerHTML=`<div class="bar hudbar"><button class="sm" id="back">${done?'Menu':'Pause'}</button><div class="row"><span class="pill">${lb}</span><span class="pill">⏱ <span id="tm">${fmt(done?g.el:(Date.now()-g.t0)/1000|0)}</span></span><button class="sm hb" id="hint" ${done||g.hints.length>=g.hmax?'disabled':''}>${g.hmax?'Hint '+(g.hmax-g.hints.length):'No hints'}</button><span class="pill">${'❤️'.repeat(g.lives)}${'🖤'.repeat(Math.max(0,g.max-g.lives))}</span></div></div>
 <svg class="lock ${g.won?'open':''}" id="lk" viewBox="0 0 60 70" width="46" aria-hidden="true"><path class="sh" d="M16 30V20a14 14 0 0 1 28 0v10" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><rect x="8" y="30" width="44" height="34" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="3"/><circle cx="30" cy="44" r="5" fill="var(--line)"/><rect x="28" y="46" width="4" height="10" fill="var(--line)"/></svg>
 <div class="clues">${g.clues.map(clueHTML).join('')}</div>
 ${g.hints.length?`<div class="hbar">${g.hints.map(i=>`Digit ${i+1} is <b>${g.secret[i]}</b>`).join(' · ')}</div>`:''}
 <div class="slots" id="slots">${slots}</div><div class="msg" style="color:${g.won?'var(--ok)':'var(--bad)'}">${g.msg}</div>${!S.tips.pu&&!g.won&&!g.lost&&Object.values(S.pu).some(v=>v)?'<div class="hbar">Tip: the items you own appear as buttons under the keypad. Tap one to use it. <button class="sm" id="tpx">Got it</button></div>':''}${end}${S.diff!=='hard'&&g.hist.length?`<h2>Your tries</h2><div class="clues">${g.hist.map(clueHTML).join('')}</div>`:''}`;

let V='home';
function press(d){
 const g=G;if(g.won||g.lost)return;
 if(g.nm){g.notes[d]=(g.notes[d]+1)%4;tone(500,.04);draw();return}
 if(g.guess.length>=g.n)return;
 if(!g.rep&&g.guess.includes(d)){g.msg='Digits do not repeat';draw();return}
 g.last=null;g.guess+=d;g.msg='';tone(700,.05,'square',.03);draw();
}
function submit(){
 const g=G;if(g.won||g.lost)return;
 if(g.guess.length<g.n){g.msg=`Enter ${g.n} digits`;draw();return}
 if(g.guess===g.secret){
  g.won=1;g.el=(Date.now()-g.t0)/1000|0;
  const h=g.hints.length;g.stars=(!g.wr&&!h)?3:(g.wr<=1&&h<=1)?2:1;
